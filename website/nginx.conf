# Static threatveil.com on Cloud Run: non-root nginx, port 8080, no dynamic backends.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  access_log /dev/stdout combined;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css text/plain application/xml image/svg+xml application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    error_page 404 /404.html;

    # Retired commercial product routes from the previous site.
    location ~ ^/(pricing|login|signup|sign-up|register|app|dashboard|demo|book-demo|contact|onboarding|trial|plans)(/.*)?$ {
      include /etc/nginx/security-headers.conf;
      return 301 /;
    }

    location ~* ^/(images/|styles\.css|favicon|apple-touch-icon|og\.png) {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }

    location = /404.html {
      include /etc/nginx/security-headers.conf;
      internal;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=300" always;
      try_files $uri $uri/index.html =404;
    }
  }
}
