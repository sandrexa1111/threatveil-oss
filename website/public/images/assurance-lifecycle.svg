<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">The ThreatVeil assurance lifecycle</title>
  <desc id="d">A system's authority and security claims are backed by evidence bound to a state. A change is classified, reviewed dependency mappings decide which evidence it invalidates, affected claims are re-verified, and current assurance is exposed through the Assurance Gate and signed Passports, with append-only history.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6770"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4533a"/></marker>
    <style>
      .bg{fill:#fbfaf7}
      .box{fill:#ffffff;stroke:#d5d9d6;stroke-width:1.5}
      .key{fill:#12302a;stroke:#12302a}
      .warn{fill:#fff4ee;stroke:#e3a58f;stroke-width:1.5}
      .lbl{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#13201c}
      .lblk{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#ffffff}
      .sub{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#5b6770}
      .subk{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#b9d3c9}
      .cap{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5b6770;letter-spacing:.08em}
      .capr{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#b4533a;letter-spacing:.08em}
      .ln{stroke:#5b6770;stroke-width:1.6;fill:none}
      .lr{stroke:#b4533a;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect class="bg" width="1200" height="420" rx="16"/>
  <text class="cap" x="40" y="44">ESTABLISH</text>
  <rect class="box" x="40" y="62" width="200" height="74" rx="10"/><text class="lbl" x="60" y="94">System + state</text><text class="sub" x="60" y="118">what runs, fingerprinted</text>
  <rect class="box" x="290" y="62" width="200" height="74" rx="10"/><text class="lbl" x="310" y="94">Authority</text><text class="sub" x="310" y="118">tools, permissions, MCP</text>
  <rect class="box" x="540" y="62" width="200" height="74" rx="10"/><text class="lbl" x="560" y="94">Security claims</text><text class="sub" x="560" y="118">what must stay true</text>
  <rect class="box" x="790" y="62" width="200" height="74" rx="10"/><text class="lbl" x="810" y="94">Evidence</text><text class="sub" x="810" y="118">bound to that state</text>
  <path class="ln" d="M240 99H286" marker-end="url(#a)"/><path class="ln" d="M490 99H536" marker-end="url(#a)"/><path class="ln" d="M740 99H786" marker-end="url(#a)"/>
  <text class="capr" x="40" y="194">CHANGE</text>
  <rect class="warn" x="40" y="212" width="200" height="74" rx="10"/><text class="lbl" x="60" y="244">Change</text><text class="sub" x="60" y="268">model, tool, permission</text>
  <rect class="warn" x="290" y="212" width="200" height="74" rx="10"/><text class="lbl" x="310" y="244">Impact</text><text class="sub" x="310" y="268">authority expanded?</text>
  <rect class="warn" x="540" y="212" width="200" height="74" rx="10"/><text class="lbl" x="560" y="244">Invalidation</text><text class="sub" x="560" y="268">via reviewed mappings</text>
  <rect class="warn" x="790" y="212" width="200" height="74" rx="10"/><text class="lbl" x="810" y="244">Re-verification</text><text class="sub" x="810" y="268">security + useful task</text>
  <path class="lr" d="M240 249H286" marker-end="url(#r)"/><path class="lr" d="M490 249H536" marker-end="url(#r)"/><path class="lr" d="M740 249H786" marker-end="url(#r)"/>
  <path class="lr" d="M890 136V150Q890 170 870 170H660Q640 170 640 190V208" marker-end="url(#r)"/>
  <text class="sub" x="664" y="164">stale for claims it reaches</text>
  <rect class="key" x="1040" y="62" width="130" height="224" rx="10"/>
  <text class="lblk" x="1058" y="100">Current</text><text class="lblk" x="1058" y="122">assurance</text>
  <text class="subk" x="1058" y="170">Gate</text><text class="subk" x="1058" y="190">machines</text>
  <text class="subk" x="1058" y="232">Passport</text><text class="subk" x="1058" y="252">other orgs</text>
  <path class="ln" d="M990 99H1036" marker-end="url(#a)"/><path class="ln" d="M990 249H1036" marker-end="url(#a)"/>
  <text class="cap" x="40" y="344">HISTORY</text>
  <rect class="box" x="40" y="356" width="1130" height="40" rx="10"/>
  <text class="sub" x="60" y="381">Append-only, signed records: a superseded conclusion stays authentic, and is no longer current.</text>
</svg>
