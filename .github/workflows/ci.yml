name: CI and security
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only-not-a-production-secret
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # TV_LOCAL_AUTH is deliberately unset: tests enable local identity themselves, and
    # activation-readiness tests must construct non-local settings.
    env:
      TV_ENV: test
      TV_CI_ADMIN_URL: postgresql://postgres:ephemeral-ci-only-not-a-production-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: '0.12.7', python-version: '3.13'}
      - run: uv sync --locked
      - run: uv run python infra/scripts/ci_database.py
      - run: uv run alembic upgrade head
      - run: uv run ruff check src tests infra/scripts
      - run: uv run pytest
      - run: git diff --exit-code -- uv.lock
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24'}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:sdk
      - run: pnpm build
      - run: git diff --exit-code -- pnpm-lock.yaml
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only-not-a-production-secret
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TV_ENV: test
      TV_LOCAL_AUTH: 'true'
      TV_CI_ADMIN_URL: postgresql://postgres:ephemeral-ci-only-not-a-production-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: '0.12.7', python-version: '3.13'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24'}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: uv sync --locked
      - run: uv run python infra/scripts/ci_database.py
      - run: uv run alembic upgrade head
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @threatveil/web exec playwright install --with-deps chromium
      - name: Start synthetic local acceptance services
        run: |
          uv run uvicorn threatveil.api:app --host 127.0.0.1 --port 8000 >.local/browser-api.log 2>&1 &
          pnpm dev >.local/browser-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null && curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/healthz >/dev/null
          curl --fail --silent http://127.0.0.1:3000/login >/dev/null
          # The web app runs in dev mode here; compile /app once so the first test does not
          # pay for it inside a navigation timeout.
          curl --silent --output /dev/null http://127.0.0.1:3000/app || true
      - run: pnpm test:web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: synthetic-browser-failures
          path: .local/browser-tests
          retention-days: 5
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: '1.16.1'}
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra test
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: '0.12.7', python-version: '3.13'}
      - run: python3 infra/scripts/install_security_tools.py
      - run: echo "$PWD/.local/security-bin" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --no-banner .
      - name: Pinned Semgrep rules and engine
        run: |
          uv tool install semgrep==1.176.0 --python 3.12
          git init .local/semgrep-rules
          git -C .local/semgrep-rules remote add origin https://github.com/semgrep/semgrep-rules.git
          git -C .local/semgrep-rules fetch --depth=1 origin 40b8c63f75dc7c22c8a77482d73bfb864b146f7e
          git -C .local/semgrep-rules checkout --detach FETCH_HEAD
          semgrep scan --config .local/semgrep-rules/python/lang/security --config .local/semgrep-rules/javascript/lang/security --severity ERROR --error --metrics off src apps/web infra/scripts
      - name: Dependency vulnerability gate
        run: osv-scanner scan source --lockfile=uv.lock --lockfile=pnpm-lock.yaml
      - name: Build locked non-root images
        run: |
          docker build -f Dockerfile.python -t threatveil-python:ci .
          docker build -f Dockerfile.web -t threatveil-web:ci .
          test "$(docker inspect threatveil-python:ci --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker inspect threatveil-web:ci --format '{{.Config.User}}')" = '65532:65532'
      - name: Runtime compatibility and health
        run: python3 infra/scripts/smoke_images.py --python-image threatveil-python:ci --web-image threatveil-web:ci
      # Container CVE scanning and SBOMs run weekly in image-scan.yml: base-image advisories change
      # independently of code and must not block unrelated pull requests.
  website:
    # threatveil.com is generated from website/src and docs/blog; the committed output must match.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: '0.12.7', python-version: '3.13'}
      - run: uv run --no-project --with markdown==3.8.2 python website/build.py
      - name: Generated site is up to date
        run: test -z "$(git status --porcelain -- website/public)" || { git status --short -- website/public; exit 1; }
      - run: docker build -t threatveil-website:ci website
  compose:
    # The documented contributor path: one command, then the synthetic demonstration.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: docker compose up --build --detach --wait
      - name: Local sign-in through the web relay
        run: |
          curl --fail --silent --show-error -o /dev/null -X POST http://127.0.0.1:3000/api/backend/v1/auth/local \
            -H 'Origin: http://127.0.0.1:3000' -H 'Content-Type: application/json' \
            -d '{"email":"compose-ci@local.invalid","organization_name":"Compose CI"}'
      - name: Canonical synthetic demonstration
        run: docker compose --profile demo run --rm demo
      - if: failure()
        run: docker compose logs --no-color
