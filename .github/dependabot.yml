# Monthly, grouped updates to keep maintenance noise low. Security updates arrive
# separately whenever an advisory applies.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    groups:
      javascript-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /website]
    schedule: {interval: monthly}
    groups:
      base-images:
        patterns: ["*"]
