# Monthly, grouped minor and patch updates to keep maintenance noise low. Major versions are
# upgraded deliberately by maintainers; security updates still arrive whenever an advisory applies.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      javascript-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /website]
    schedule: {interval: monthly}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
